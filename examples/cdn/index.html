<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Load Babylon Lite from the jsDelivr npm CDN and run an interactive WebGPU 3D scene with an import map, native ES modules, and no bundler."
    />
    <link rel="canonical" href="https://raananw.github.io/babylon-lite-in-browser/examples/cdn/" />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Babylon Lite in the browser" />
    <meta property="og:title" content="Load Babylon Lite from an npm CDN" />
    <meta
      property="og:description"
      content="Run a Babylon.js Lite 3D scene from jsDelivr using only an import map and browser modules."
    />
    <meta property="og:url" content="https://raananw.github.io/babylon-lite-in-browser/examples/cdn/" />
    <meta
      property="og:image"
      content="https://raananw.github.io/babylon-lite-in-browser/assets/previews/cdn.png"
    />
    <meta property="og:image:alt" content="Babylon Lite 3D scene loaded from jsDelivr" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Load Babylon Lite from an npm CDN with no bundler</title>
    <link rel="stylesheet" href="../../shared/example.css" />
    <script type="importmap">
      {
        "imports": {
          "@babylonjs/lite": "https://cdn.jsdelivr.net/npm/@babylonjs/lite@1.28.0/dist/index.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
    <script type="module" src="../../shared/source-viewer.js"></script>
  </head>
  <body>
    <div class="example-bar">
      <a href="../../">← Examples</a>
      <h1 class="example-title">Load from an npm CDN</h1>
      <span id="status" role="status">Initializing...</span>
    </div>
    <canvas id="renderCanvas" aria-label="Interactive Babylon Lite scene loaded from jsDelivr"></canvas>
    <p class="hint">The Babylon Lite browser distribution comes directly from jsDelivr</p>
  </body>
</html>
