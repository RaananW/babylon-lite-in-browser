<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    />
    <link rel="canonical" href="https://raananw.github.io/babylon-lite-in-browser/examples/animation/" />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Babylon Lite in the browser" />
    <meta property="og:title" content="Animate a Babylon Lite 3D scene" />

    <meta
      property="og:image"
      content="https://raananw.github.io/babylon-lite-in-browser/assets/previews/animation.png"

    <meta property="og:image:alt" content="An animated Babylon Lite 3D scene" />

    <title>Animate a Babylon Lite 3D scene in the browser</title>
    <link rel="stylesheet" href="../../shared/example.css" />
    <script type="importmap">
      {
        "imports": {
          "@babylonjs/lite": "../../vendor/@babylonjs/lite/index.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
    <script type="module" src="../../shared/source-viewer.js"></script>

  <body>
    <div class="example-bar">
